# ZAP Baseline rule config for Scoping Track B (authorized hosts only).
# WARN = report; IGNORE = drop; FAIL = treat as CI failure.
# OUTOFSCOPE regexes keep the spider off gated / write surfaces.
#
# Do not enable active-scan rules here. This file is for zap-baseline.py only.

# Gated assessor APIs and internal drops — observe 401/404 by hand, do not spider-attack.
*	OUTOFSCOPE	.*/api/assessor/emass.*
*	OUTOFSCOPE	.*/api/submissions.*
*	OUTOFSCOPE	.*/drop/.*/internal.*

# Public intake write path — GET the form; do not POST live OSC answers.
*	OUTOFSCOPE	.*/api/submit.*

# Submit Worker is HEADER/TLS/CORS observation only (see scripts/zap-observe-submit.sh).
*	OUTOFSCOPE	https://prescope-submit\.example\.workers\.dev.*
