# OWASP ZAP Automation Framework plan — Scoping Track B baseline.
# Generated by scripts/zap-baseline.sh. Spider + passive only. No active scan.
# Placeholders: https://prescope-intake.example.workers.dev https://prescope-intake.example.workers.dev/intake /workspace/docs/security/zap 2 
---
env:
  contexts:
    - name: prescope-intake
      urls:
        - "https://prescope-intake.example.workers.dev"
      includePaths:
        - "https://prescope-intake.example.workers.dev/.*"
      excludePaths:
        - "https://prescope-intake.example.workers.dev/api/assessor/emass.*"
        - "https://prescope-intake.example.workers.dev/api/submissions.*"
        - "https://prescope-intake.example.workers.dev/drop/.*/internal.*"
        - "https://prescope-intake.example.workers.dev/api/submit.*"
        - "https://prescope-submit.example.workers.dev.*"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true
    continueOnFailure: true

jobs:
  - type: passiveScan-config
    parameters:
      enableTags: false
      maxAlertsPerRule: 10

  - type: spider
    parameters:
      context: prescope-intake
      url: "https://prescope-intake.example.workers.dev/intake"
      maxDuration: 2
      maxDepth: 8
      maxChildren: 30
      threadCount: 2
      parseComments: true
      parseRobotsTxt: true
      parseSitemapXml: true
      postForm: false
      processForm: false
      userAgent: "ScopingAuthorizedDAST/1.0 (ZAP-Baseline; +https://github.com/GRCJP/Assessment-Scoping)"
    tests:
      - name: at least 1 URL found
        type: stats
        statistic: automation.spider.urls.added
        operator: ">="
        value: 1
        onFail: info


  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: report
    parameters:
      template: traditional-html
      reportDir: "/workspace/docs/security/zap"
      reportFile: "zap-baseline-report"
      reportTitle: "Scoping Track B — ZAP Baseline (authorized)"
      reportDescription: "Spider + passive scan only. No active scan, no secret probing."

  - type: report
    parameters:
      template: traditional-json
      reportDir: "/workspace/docs/security/zap"
      reportFile: "zap-baseline-report"
      reportTitle: "Scoping Track B — ZAP Baseline (authorized)"
      reportDescription: "Spider + passive scan only. No active scan, no secret probing."
